name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - 'capacitor.config.*'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install deps
        run: npm ci || npm install
      - name: Build web
        run: npm run build
      - name: Ensure Capacitor CLI
        run: npm ls @capacitor/cli >/dev/null 2>&1 || npm install -D @capacitor/cli @capacitor/core @capacitor/android
      - name: Init Android platform
        run: |
          npx cap add android || true
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-deck-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Prepare release signing (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=app/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          # Inject signing config into app build.gradle if not present
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'keystore.properties' not in s:
            inject = "def keystorePropertiesFile = rootProject.file('keystore.properties')\ndef keystoreProperties = new Properties()\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }\n\n"
            s = s.replace('android {\n', 'import java.util.Properties\nimport java.io.FileInputStream\n\n' + inject + 'android {\n', 1)
            signing = """
                signingConfigs {
                    release {
                        if (keystoreProperties['storeFile']) {
                            storeFile file(keystoreProperties['storeFile'])
                            storePassword keystoreProperties['storePassword']
                            keyAlias keystoreProperties['keyAlias']
                            keyPassword keystoreProperties['keyPassword']
                        }
                    }
                }
            """
            s = s.replace('    buildTypes {\n', signing + '\n    buildTypes {\n', 1)
            s = s.replace('        release {\n            minifyEnabled false\n', '        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false\n', 1)
            p.write_text(s)
          print('signing configured')
          PY
      - name: Build release APK (optional, signed)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Upload release APK artifact
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: focus-deck-release-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Release notes
        if: ${{ !(secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '') }}
        run: echo "Release APK not built: signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) not configured. Debug APK artifact is available."
